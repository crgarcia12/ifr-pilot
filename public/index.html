<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- Merged from main: missions, map, radio panel, multiple navaids -->
<title>IFR Pilot</title>
<style>
  :root{
    --bg:#06090d; --panel:#0d141d; --ink:#cfe7ff; --dim:#5b7a99;
    --accent:#00ff9d; --warn:#ffb547; --danger:#ff5c5c; --edge:#1f2f44;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #app{
    position:fixed;inset:0;display:grid;
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:auto 1fr auto;
    gap:8px;padding:8px;padding-right:300px;
  }
  header{
    grid-column:1 / -1;display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px 12px;
  }
  header h1{margin:0;font-size:14px;letter-spacing:.15em;color:var(--accent)}
  header .pfd{display:flex;gap:18px;font-size:12px;color:var(--ink);flex-wrap:wrap}
  header .pfd b{color:var(--accent)}
  .inst{
    background:var(--panel);border:1px solid var(--edge);border-radius:8px;
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .inst .title{
    font-size:11px;letter-spacing:.2em;color:var(--dim);
    padding:6px 10px;border-bottom:1px solid var(--edge);text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center;
  }
  .inst .title .badge{color:var(--accent);font-weight:700}
  .inst canvas{display:block;flex:1;width:100%;height:100%;background:#070b10}
  footer{
    grid-column:1 / -1;display:flex;justify-content:center;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px;
    position:relative;
  }
  .version{
    position:absolute;right:12px;font-size:10px;color:var(--dim);opacity:0.6;
  }
  .vel{display:flex;gap:6px}
  .vel button{
    appearance:none;border:1px solid #28405c;background:#0e1620;color:var(--ink);
    font-family:inherit;font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;min-width:42px
  }
  .vel button:hover{border-color:#3a5a82}
  .vel button.active{background:var(--accent);color:#001b10;border-color:var(--accent);font-weight:700}
  .legend{font-size:11px;color:var(--dim)}
  .legend kbd{background:#0e1620;border:1px solid #28405c;border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink)}
  #toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:10px 16px;border-radius:6px;color:var(--accent);font-size:14px;display:none;z-index:9}
  /* ── Aviation-style Autopilot + Radio panels ─────────────────────────── */
  /* Buttons that look like backlit cockpit pushbuttons. */
  .av-btn{
    appearance:none;font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;
    padding:6px 10px;border-radius:4px;cursor:pointer;
    background:linear-gradient(#1a2535,#0c131c);
    color:#7c92aa;border:1px solid #2a3d56;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 1px 0 #000;
    min-width:46px;
  }
  .av-btn:hover{border-color:#3a5a82;color:#cfe7ff}
  .av-btn.on{
    background:linear-gradient(#00ffae,#00b87a);
    color:#001b10;border-color:#00ffae;
    box-shadow:0 0 6px rgba(0,255,157,.65), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .av-btn.warn.on{
    background:linear-gradient(#ffd073,#ff9b1c);color:#2b1500;border-color:#ffb547;
    box-shadow:0 0 6px rgba(255,181,71,.65);
  }

  /* Digital readout — 7-segment-ish LED look */
  .led{
    font-family:'Courier New',ui-monospace,monospace;
    font-weight:700;letter-spacing:.06em;
    background:#040708;border:1px solid #1f2f44;border-radius:4px;
    padding:4px 8px;color:#ffb547;
    text-shadow:0 0 6px rgba(255,181,71,.55);
    text-align:center;display:inline-block;min-width:64px;
  }
  .led.green{color:#00ff9d;text-shadow:0 0 6px rgba(0,255,157,.55)}
  .led.cyan{color:#7cd8ff;text-shadow:0 0 6px rgba(124,216,255,.55)}
  .led.dim{color:#3a5a82;text-shadow:none}

  /* Autopilot */
  #ap-panel{
    display:flex;flex-direction:column;gap:8px;padding:10px;
    background:#070b10;border-top:1px solid #1f2f44;
  }
  #ap-modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  #ap-knobs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ap-knob{
    background:linear-gradient(#0c131c,#070b10);border:1px solid #1f2f44;
    border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;
    align-items:center;
  }
  .ap-knob .lbl{font-size:9px;letter-spacing:.25em;color:#5b7a99}
  .ap-knob .row{display:flex;gap:4px;align-items:center}
  .ap-knob button{
    appearance:none;width:24px;height:22px;border-radius:3px;cursor:pointer;
    background:linear-gradient(#1a2535,#0c131c);border:1px solid #2a3d56;
    color:#cfe7ff;font-family:inherit;font-size:14px;line-height:1;font-weight:700;
  }
  .ap-knob button:hover{border-color:#3a5a82}
  .ap-knob .led{cursor:pointer;user-select:none;border-radius:3px;padding:1px 4px}
  .ap-knob .led:hover{outline:1px dashed #3a5a82}
  .ap-knob.armed{border-color:#ffeb3b;box-shadow:0 0 0 1px rgba(255,235,59,.45) inset, 0 0 8px rgba(255,235,59,.35)}
  .ap-knob.armed .led{outline:1px solid #ffeb3b}
  .rad-row .led{cursor:pointer;user-select:none;border-radius:3px;padding:1px 4px}
  .rad-row .led:hover{outline:1px dashed #3a5a82}
  .rad-row.armed{border-color:#ffeb3b;box-shadow:0 0 0 1px rgba(255,235,59,.45) inset, 0 0 8px rgba(255,235,59,.35)}
  .rad-row.armed .led{outline:1px solid #ffeb3b}

  /* Map popup */
  #map{position:relative}
  #map-popup{
    position:absolute;pointer-events:auto;display:none;
    background:linear-gradient(#0c131c,#070b10);
    border:1px solid #2a3d56;border-radius:6px;padding:8px 10px;
    color:#cfe7ff;font-family:inherit;font-size:11px;line-height:1.35;
    box-shadow:0 6px 18px rgba(0,0,0,.6);min-width:160px;z-index:5;
  }
  #map-popup .pop-id{font-size:13px;font-weight:700;color:#00ff9d;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
  #map-popup .pop-id.ils{color:#ffb547}
  #map-popup .pop-name{color:#7cd8ff;margin-top:2px}
  #map-popup .pop-row{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
  #map-popup .pop-row b{color:#ffeb3b;font-weight:700}
  #map-popup .pop-close{position:absolute;top:2px;right:6px;cursor:pointer;color:#5b7a99;font-size:14px;line-height:1}
  #map-popup .pop-close:hover{color:#cfe7ff}
  #map-popup .pop-tune{
    margin-top:6px;width:100%;cursor:pointer;
    background:linear-gradient(#1a2535,#0c131c);border:1px solid #2a3d56;border-radius:3px;
    color:#cfe7ff;font-family:inherit;font-size:10px;padding:3px 6px;letter-spacing:.1em;
  }
  #map-popup .pop-tune:hover{border-color:#7cd8ff;color:#7cd8ff}

  /* Radio stack */
  #radio-panel{
    display:flex;flex-direction:column;gap:6px;padding:10px;
    background:#070b10;border-top:1px solid #1f2f44;
  }
  .rad-row{
    display:grid;grid-template-columns:48px 1fr auto 1fr 28px;gap:6px;align-items:center;
    background:linear-gradient(#0c131c,#070b10);border:1px solid #1f2f44;
    border-radius:6px;padding:5px 8px;
  }
  .rad-row .id{font-size:10px;letter-spacing:.2em;color:#5b7a99;font-weight:700}
  .rad-row .freq-stack{display:flex;flex-direction:column;align-items:center;gap:2px}
  .rad-row .freq-stack .lbl{font-size:8px;letter-spacing:.2em;color:#3a5a82}
  .rad-row .freq-ctrl{display:flex;gap:3px;align-items:center}
  .rad-row .freq-ctrl button{
    appearance:none;width:20px;height:18px;border-radius:3px;cursor:pointer;
    background:linear-gradient(#1a2535,#0c131c);border:1px solid #2a3d56;
    color:#cfe7ff;font-family:inherit;font-size:11px;line-height:1;
  }
  .rad-row .freq-ctrl button:hover{border-color:#3a5a82}
  .rad-row .swap{
    appearance:none;width:24px;height:24px;border-radius:50%;cursor:pointer;
    background:linear-gradient(#1a2535,#0c131c);border:1px solid #2a3d56;
    color:#7cd8ff;font-family:inherit;font-size:14px;line-height:1;
  }
  .rad-row .swap:hover{border-color:#7cd8ff;color:#cfe7ff}
  @media (max-width: 900px){
    #app{grid-template-columns:1fr 1fr;}
    #ai{grid-column:1 / -1;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>IFR&nbsp;PILOT</h1>
    <div class="pfd">
      <span>HDG <b id="hdg">000</b>°</span>
      <span>ALT <b id="alt">3000</b> ft</span>
      <span>IAS <b id="ias">120</b> kt</span>
      <span>V/S <b id="vs">+0</b> fpm</span>
      <span>POS <b id="pos">47.4500, -122.3000</b></span>
      <span>SIM <b id="rate">1x</b></span>
      <span>T <b id="clk">00:00:00</b></span>
    </div>
  </header>

  <section class="inst" id="ai">
    <div class="title"><span>Attitude Indicator</span><span class="badge">AI</span></div>
    <canvas id="cv-ai"></canvas>
  </section>

  <section class="inst" id="vor">
    <div class="title"><span>VOR / HSI</span><span class="badge" id="vor-id">SEA 117.80</span></div>
    <canvas id="cv-vor"></canvas>
  </section>

  <section class="inst" id="map">
    <div class="title"><span>Moving Map</span><span class="badge" id="map-scale">5 NM</span></div>
    <canvas id="cv-map"></canvas>
    <div id="map-popup" role="dialog" aria-label="Navaid info"></div>
  </section>

  <section class="inst" id="radio">
    <div class="title"><span>COM / NAV Radio</span><span class="badge" id="radio-active-id">NAV1 ---</span></div>
    <div id="radio-panel"></div>
  </section>

  <section class="inst" id="ap" style="grid-column:2 / -1">
    <div class="title"><span>Autopilot</span><span class="badge" id="ap-master">OFF</span></div>
    <div id="ap-panel">
      <div id="ap-modes">
        <button class="av-btn" id="ap-toggle" title="Master AP">AP</button>
        <button class="av-btn" id="ap-hdg" title="Heading hold">HDG</button>
        <button class="av-btn" id="ap-nav" title="Track NAV1 course">NAV</button>
        <button class="av-btn warn" id="ap-apr" title="Approach">APR</button>
        <button class="av-btn" id="ap-alt" title="Altitude hold">ALT</button>
        <button class="av-btn" id="ap-vs" title="Vertical speed mode">VS</button>
      </div>
      <div id="ap-knobs">
        <div class="ap-knob">
          <div class="lbl">HDG</div>
          <div class="led green" id="ap-hdg-val">090°</div>
          <div class="row"><button id="ap-hdg-dn" type="button">−</button><button id="ap-hdg-up" type="button">+</button></div>
        </div>
        <div class="ap-knob">
          <div class="lbl">CRS</div>
          <div class="led cyan" id="ap-crs-val">090°</div>
          <div class="row"><button id="ap-crs-dn" type="button">−</button><button id="ap-crs-up" type="button">+</button></div>
        </div>
        <div class="ap-knob">
          <div class="lbl">ALT</div>
          <div class="led" id="ap-alt-val">3000</div>
          <div class="row"><button id="ap-alt-dn" type="button">−</button><button id="ap-alt-up" type="button">+</button></div>
        </div>
        <div class="ap-knob">
          <div class="lbl">VS</div>
          <div class="led" id="ap-vs-val">+0</div>
          <div class="row"><button id="ap-vs-dn" type="button">−</button><button id="ap-vs-up" type="button">+</button></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="vel" id="vel" role="toolbar" aria-label="Simulation rate"></div>
    <div class="legend">
      <kbd>←</kbd><kbd>→</kbd> roll · <kbd>↑</kbd><kbd>↓</kbd> pitch ·
      <kbd>A</kbd>/<kbd>Z</kbd> throttle · <kbd>[</kbd>/<kbd>]</kbd> sim-rate · <kbd>P</kbd> pause
    </div>
    <div class="version">FE 0.0.2</div>
  </footer>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  // ===== Constants =========================================================
  const RATES = [1, 2, 4, 8, 16, 32];
  const STORAGE_KEY = 'ifrPilot.simRate';
  const MAX_STEP = 1/30;

  // VOR station near starting point (Seattle VORTAC, fictionalized)
  const VOR = { id: 'SEA', freq: '117.80', lat: 47.435, lon: -122.309, courseOBS: 90 };

  // ===== State =============================================================
  const state = {
    lat: 47.45, lon: -122.30,
    alt: 3000, hdg: 90, pitch: 0, roll: 0,
    ias: 120, vs: 0, throttle: 0.6,
    paused: false,
    simRate: loadRate(),
    simTime: 0,
    lastWall: 0,
    ap: { master: false, hdgOn: false, altOn: false, navOn: false, aprOn: false, vsOn: false,
          hdgTarget: 90, altTarget: 3000, vsTarget: 0, obs: 90 },
    // Visual smoothing for the VOR/HSI CDI bar so the needle doesn't snap from
    // peg-to-peg. Lerps toward the raw vorCdi() value with a ~1.8s time
    // constant — the AP loop still uses the raw value for responsiveness.
    cdiDisplay: 0,
    // Radio stack — active/standby pairs. NAV1 active picks the navaid that
    // drives the VOR/HSI; CRS knob sets the OBS for that navaid.
    radio: {
      nav1: { active: 117.80, standby: 113.50 },
      nav2: { active: 112.30, standby: 115.10 },
      com1: { active: 118.10, standby: 121.90 },
      com2: { active: 119.45, standby: 124.20 }
    }
  };

  function loadRate(){
    try{ const v = parseFloat(localStorage.getItem(STORAGE_KEY)); if (RATES.includes(v)) return v; }catch(_){}
    return 1;
  }
  function saveRate(r){ try{ localStorage.setItem(STORAGE_KEY, String(r)); }catch(_){ } }

  // ===== Velocity buttons ==================================================
  const velEl = document.getElementById('vel');
  function renderVel(){
    velEl.innerHTML = '';
    for (const r of RATES){
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = r + 'x'; b.dataset.rate = String(r);
      b.setAttribute('aria-pressed', String(r === state.simRate));
      if (r === state.simRate) b.classList.add('active');
      b.addEventListener('click', () => setRate(r));
      velEl.appendChild(b);
    }
  }
  function setRate(r){
    if (!RATES.includes(r)) return;
    state.simRate = r; saveRate(r); renderVel(); showToast(r + 'x');
  }
  function cycleRate(d){
    const i = RATES.indexOf(state.simRate);
    setRate(RATES[Math.max(0, Math.min(RATES.length-1, i+d))]);
  }

  // ===== Toast =============================================================
  let toastT = 0;
  const toastEl = document.getElementById('toast');
  function showToast(t){
    toastEl.textContent = t; toastEl.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.display = 'none', 700);
  }

  // ===== Input =============================================================
  const keys = Object.create(null);
  window.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    keys[e.key.toLowerCase()] = true;
    if (e.key === ']') { cycleRate(+1); e.preventDefault(); }
    else if (e.key === '[') { cycleRate(-1); e.preventDefault(); }
    else if (e.key.toLowerCase() === 'p') { state.paused = !state.paused; showToast(state.paused ? 'PAUSED' : 'RESUMED'); }
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  // ===== Autopilot wiring ==================================================
  const apEls = {
    master: document.getElementById('ap-master'),
    toggle: document.getElementById('ap-toggle'),
    hdg: document.getElementById('ap-hdg'),
    nav: document.getElementById('ap-nav'),
    apr: document.getElementById('ap-apr'),
    alt: document.getElementById('ap-alt'),
    vs: document.getElementById('ap-vs'),
    hdgVal: document.getElementById('ap-hdg-val'),
    crsVal: document.getElementById('ap-crs-val'),
    altVal: document.getElementById('ap-alt-val'),
    vsVal: document.getElementById('ap-vs-val')
  };
  function fmtDeg(v){ return String(Math.round(((v%360)+360)%360)).padStart(3,'0') + '°'; }
  function fmtFt(v){ return String(Math.max(0, Math.round(v))).padStart(4,'0'); }
  function fmtVs(v){ const n = Math.round(v); return (n>=0?'+':'') + Math.abs(n).toString().padStart(3,'0').padStart(4, n<0?' ':' '); }
  function syncAp(){
    apEls.master.textContent = state.ap.master ? 'ON' : 'OFF';
    apEls.master.style.color = state.ap.master ? 'var(--accent)' : 'var(--dim)';
    apEls.toggle.classList.toggle('on', state.ap.master);
    apEls.hdg.classList.toggle('on', state.ap.hdgOn);
    apEls.nav.classList.toggle('on', state.ap.navOn);
    apEls.apr.classList.toggle('on', state.ap.aprOn);
    apEls.alt.classList.toggle('on', state.ap.altOn);
    apEls.vs.classList.toggle('on', state.ap.vsOn);
    apEls.hdgVal.textContent = fmtDeg(state.ap.hdgTarget);
    apEls.crsVal.textContent = fmtDeg(VOR.courseOBS);
    apEls.altVal.textContent = fmtFt(state.ap.altTarget);
    const vs = Math.round(state.ap.vsTarget);
    apEls.vsVal.textContent = (vs>=0?'+':'-') + String(Math.abs(vs)).padStart(4,'0');
  }
  function bumpHdg(d){ state.ap.hdgTarget = (((state.ap.hdgTarget + d)%360)+360)%360; syncAp(); }
  function bumpCrs(d){ VOR.courseOBS = (((VOR.courseOBS + d)%360)+360)%360; state.ap.obs = VOR.courseOBS; syncAp(); }
  function bumpAlt(d){ state.ap.altTarget = Math.max(0, Math.min(40000, state.ap.altTarget + d)); syncAp(); }
  function bumpVs(d){ state.ap.vsTarget = Math.max(-3000, Math.min(3000, state.ap.vsTarget + d)); syncAp(); }
  apEls.toggle.addEventListener('click', () => { state.ap.master = !state.ap.master; syncAp(); });
  apEls.hdg.addEventListener('click', () => { state.ap.hdgOn = !state.ap.hdgOn; if (state.ap.hdgOn){ state.ap.navOn = false; state.ap.aprOn = false; } syncAp(); });
  apEls.nav.addEventListener('click', () => { state.ap.navOn = !state.ap.navOn; if (state.ap.navOn){ state.ap.hdgOn = false; state.ap.aprOn = false; } syncAp(); });
  apEls.apr.addEventListener('click', () => { state.ap.aprOn = !state.ap.aprOn; if (state.ap.aprOn){ state.ap.navOn = false; state.ap.hdgOn = false; } syncAp(); });
  apEls.alt.addEventListener('click', () => { state.ap.altOn = !state.ap.altOn; if (state.ap.altOn) state.ap.vsOn = false; syncAp(); });
  apEls.vs.addEventListener('click', () => { state.ap.vsOn = !state.ap.vsOn; if (state.ap.vsOn) state.ap.altOn = false; syncAp(); });
  document.getElementById('ap-hdg-up').addEventListener('click', () => bumpHdg(+1));
  document.getElementById('ap-hdg-dn').addEventListener('click', () => bumpHdg(-1));
  document.getElementById('ap-crs-up').addEventListener('click', () => bumpCrs(+1));
  document.getElementById('ap-crs-dn').addEventListener('click', () => bumpCrs(-1));
  document.getElementById('ap-alt-up').addEventListener('click', () => bumpAlt(+100));
  document.getElementById('ap-alt-dn').addEventListener('click', () => bumpAlt(-100));
  document.getElementById('ap-vs-up').addEventListener('click', () => bumpVs(+100));
  document.getElementById('ap-vs-dn').addEventListener('click', () => bumpVs(-100));
  // Click-and-hold to spin a knob faster.
  for (const id of ['ap-hdg-up','ap-hdg-dn','ap-crs-up','ap-crs-dn','ap-alt-up','ap-alt-dn','ap-vs-up','ap-vs-dn']){
    let t = null, n = 0;
    const el = document.getElementById(id);
    const sign = id.endsWith('-up') ? +1 : -1;
    const fn = id.startsWith('ap-hdg') ? bumpHdg : id.startsWith('ap-crs') ? bumpCrs : id.startsWith('ap-alt') ? bumpAlt : bumpVs;
    const step = (id.startsWith('ap-alt') || id.startsWith('ap-vs')) ? 100 : 1;
    const stop = () => { if (t) clearInterval(t); t = null; n = 0; };
    el.addEventListener('mousedown', () => { n = 0; t = setInterval(() => { n++; fn(sign * step * (n>20 ? 10 : 1)); }, 90); });
    el.addEventListener('mouseup', stop); el.addEventListener('mouseleave', stop);
  }
  // ===== Radio panel wiring ================================================
  (function buildRadio(){
    const radioEl = document.getElementById('radio-panel');
    const rows = [
      { key:'nav1', label:'NAV 1', step:0.05, min:108.00, max:117.95, fmt:(v)=>v.toFixed(2) },
      { key:'nav2', label:'NAV 2', step:0.05, min:108.00, max:117.95, fmt:(v)=>v.toFixed(2) },
      { key:'com1', label:'COM 1', step:0.025, min:118.000, max:136.975, fmt:(v)=>v.toFixed(3) },
      { key:'com2', label:'COM 2', step:0.025, min:118.000, max:136.975, fmt:(v)=>v.toFixed(3) }
    ];
    function activeBadge(){
      const f = state.radio.nav1.active.toFixed(2);
      const navaids = window.__ifrNavaids || [];
      const hit = navaids.find(n => Math.abs(parseFloat(n.freq) - state.radio.nav1.active) < 0.01);
      document.getElementById('radio-active-id').textContent = 'NAV1 ' + (hit ? hit.id : '----') + ' ' + f;
    }
    function tuneVorFromNav1(){
      const navaids = window.__ifrNavaids || [];
      const hit = navaids.find(n => Math.abs(parseFloat(n.freq) - state.radio.nav1.active) < 0.01);
      if (hit){ VOR.id = hit.id; VOR.freq = parseFloat(hit.freq).toFixed(2); VOR.lat = hit.lat; VOR.lon = hit.lon;
        const vid = document.getElementById('vor-id'); if (vid) vid.textContent = VOR.id + ' ' + VOR.freq;
      }
      activeBadge();
    }
    window.__ifrTuneVorFromNav1 = tuneVorFromNav1;
    window.__ifrRadioRender = () => render();
    function render(){
      radioEl.innerHTML = '';
      for (const r of rows){
        const s = state.radio[r.key];
        const row = document.createElement('div');
        row.className = 'rad-row';
        row.innerHTML = `
          <div class="id">${r.label}</div>
          <div class="freq-stack">
            <div class="lbl">ACTIVE</div>
            <div class="led green" id="rad-${r.key}-act">${r.fmt(s.active)}</div>
          </div>
          <div class="freq-ctrl">
            <button data-act="dn" data-k="${r.key}">−</button>
            <button data-act="up" data-k="${r.key}">+</button>
          </div>
          <div class="freq-stack">
            <div class="lbl">STANDBY</div>
            <div class="led" id="rad-${r.key}-sby">${r.fmt(s.standby)}</div>
          </div>
          <button class="swap" data-swap="${r.key}" title="Swap active ⇄ standby">⇄</button>
        `;
        radioEl.appendChild(row);
      }
      activeBadge();
    }
    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    radioEl.addEventListener('click', (e) => {
      const t = e.target.closest('button'); if (!t) return;
      const swap = t.getAttribute('data-swap');
      if (swap){
        const s = state.radio[swap]; const tmp = s.active; s.active = s.standby; s.standby = tmp;
        render(); if (swap === 'nav1') tuneVorFromNav1(); return;
      }
      const k = t.getAttribute('data-k'); const dir = t.getAttribute('data-act');
      if (!k) return;
      const r = rows.find(x => x.key === k); const s = state.radio[k];
      s.standby = Math.round(clamp(s.standby + (dir==='up'?+r.step:-r.step), r.min, r.max) / r.step) * r.step;

  })();
  syncAp();

  // ===== Physics step =====================================================
  function clamp(v, lo, hi){ return v<lo?lo:v>hi?hi:v; }
  function angleDiff(a, b){ // smallest signed (a-b)
    let d = ((a-b+540)%360)-180; return d;
  }

  function step(dt){
    // Manual inputs
    const rollRate = 35, pitchRate = 15, thrRate = 0.4;
    if (keys['arrowleft'])  state.roll  = clamp(state.roll  - rollRate*dt, -45, 45);
    if (keys['arrowright']) state.roll  = clamp(state.roll  + rollRate*dt, -45, 45);
    if (keys['arrowup'])    state.pitch = clamp(state.pitch + pitchRate*dt, -15, 15);
    if (keys['arrowdown'])  state.pitch = clamp(state.pitch - pitchRate*dt, -15, 15);
    if (keys['a'])          state.throttle = clamp(state.throttle + thrRate*dt, 0, 1);
    if (keys['z'])          state.throttle = clamp(state.throttle - thrRate*dt, 0, 1);

    // Autopilot (mild authority, will not fight strong stick input)
    if (state.ap.master){
      // Lateral: HDG, NAV, or APR (APR uses tighter intercept)
      let hdgTarget = state.ap.hdgTarget;
      let lateralActive = state.ap.hdgOn || state.ap.navOn || state.ap.aprOn;
      if (state.ap.navOn || state.ap.aprOn){
        const cdi = vorCdi();
        const distToCourse = distanceToCourseLine();
        
        // Calculate turn anticipation distance (in NM)
        const turnRadius = (state.ias / 60) / (3 * Math.PI / 180);
        const anticipationDist = turnRadius * 0.7;
        
        // Deadband: if very close to course (< 0.05 NM), fly the course directly
        if (distToCourse < 0.05) {
          hdgTarget = VOR.courseOBS;
        } else {
          // Reduce intercept angle as we approach the course line with turn anticipation
          let intercept = 0;
          const baseGain = state.ap.aprOn ? 35 : 30; // Reduced from 45 to prevent oscillation
          const interceptLimit = state.ap.aprOn ? 20 : 30; // Reduced from 45
          
          if (distToCourse > anticipationDist) {
            // Far from course - use aggressive intercept
            intercept = clamp(cdi * baseGain, -interceptLimit, interceptLimit);
          } else {
            // Close to course - reduce intercept smoothly
            const factor = distToCourse / anticipationDist;
            intercept = clamp(cdi * baseGain * factor, -10, 10);
          }
          
          hdgTarget = (VOR.courseOBS + intercept + 360) % 360;
        }
        
        // Override: if very close to station, just fly outbound
        const dist = haversineNm(state.lat, state.lon, VOR.lat, VOR.lon);
        if (dist < 0.5) hdgTarget = VOR.courseOBS;
      }
      if (lateralActive){
        const err = angleDiff(hdgTarget, state.hdg);
        // Reduced gain from 2.0 to 1.5 to prevent oscillation
        const targetRoll = clamp(err * 1.5, -25, 25);
        state.roll += (targetRoll - state.roll) * Math.min(1, 1.5*dt);
      }
      // Vertical: ALT hold or VS hold (APR also nudges down on glide)
      if (state.ap.altOn){
        const errFt = state.ap.altTarget - state.alt;
        const targetVs = clamp(errFt * 6, -1500, 1500);
        const targetPitch = clamp(targetVs / 100, -10, 10);
        state.pitch += (targetPitch - state.pitch) * Math.min(1, 1.5*dt);
      } else if (state.ap.vsOn){
        const targetPitch = clamp(state.ap.vsTarget / 100, -10, 10);
        state.pitch += (targetPitch - state.pitch) * Math.min(1, 1.5*dt);
      } else if (state.ap.aprOn){
        // 3° glide approximation
        const targetPitch = -3;
        state.pitch += (targetPitch - state.pitch) * Math.min(1, 0.6*dt);
      }
    }

    // Auto-level when no roll input AND AP is not commanding
    if (!keys['arrowleft'] && !keys['arrowright'] && !state.ap.master)
      state.roll *= Math.max(0, 1 - 0.5*dt);

    // Coordinated turn -> heading
    const turn = 3.0 * Math.tan(state.roll * Math.PI/180);
    state.hdg = (state.hdg + turn*dt + 360) % 360;

    // Climb / descend
    const targetVs = state.pitch * 100;
    state.vs += (targetVs - state.vs) * Math.min(1, 2*dt);
    state.alt = Math.max(0, state.alt + state.vs * (dt/60));

    // Airspeed
    const targetIas = 70 + state.throttle * 110;
    state.ias += (targetIas - state.ias) * Math.min(1, 0.5*dt);

    // Position (flat-earth, fine for this fidelity)
    const distNm = (state.ias / 3600) * dt;
    const hdgRad = state.hdg * Math.PI / 180;
    const dLat = (distNm * Math.cos(hdgRad)) / 60;
    const dLon = (distNm * Math.sin(hdgRad)) / (60 * Math.max(0.001, Math.cos(state.lat * Math.PI/180)));
    state.lat += dLat; state.lon += dLon;

    // Smooth the displayed CDI toward the raw value (1st-order low-pass,
    // tau ≈ 1.8 s) so the green deviation bar sweeps across the dial rather
    // than snapping peg-to-peg as the aircraft crosses the radial.
    {
      const raw = vorCdi();
      const tau = 1.8;
      const a = 1 - Math.exp(-dt / tau);
      state.cdiDisplay += (raw - state.cdiDisplay) * a;
    }

    state.simTime += dt;
  }

  // ===== Nav math ==========================================================
  function bearingTo(lat1, lon1, lat2, lon2){
    const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
    const Δλ = (lon2-lon1)*Math.PI/180;
    const y = Math.sin(Δλ)*Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    return ((Math.atan2(y, x)*180/Math.PI)+360)%360;
  }
  function haversineNm(lat1, lon1, lat2, lon2){
    const R = 3440.065;
    const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
    const dφ = (lat2-lat1)*Math.PI/180, dλ = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function vorCdi(){
    // Course deviation: angle from VOR to A/C minus selected radial.
    // CDI sign convention: "fly toward the bar." If the aircraft is RIGHT of
    // the selected course (clockwise from the OBS radial as seen from the
    // station, dev > 0), the course is to the aircraft's LEFT, so the bar
    // must deflect LEFT — hence the negation. This sign also makes the NAV
    // autopilot intercept turn toward the course rather than away from it.
    const brgFromVor = bearingTo(VOR.lat, VOR.lon, state.lat, state.lon);
    const dev = angleDiff(brgFromVor, VOR.courseOBS); // degrees
    // Aviation standards: VOR = 10° full-scale, ILS = 2.5° full-scale
    const fullScale = state.ap.aprOn ? 2.5 : 10;
    return clamp(-dev / fullScale, -1, 1);
  }
  
  function distanceToCourseLine(){
    // Perpendicular distance from aircraft to VOR course line (NM)
    const distToVor = haversineNm(state.lat, state.lon, VOR.lat, VOR.lon);
    const brgToVor = bearingTo(state.lat, state.lon, VOR.lat, VOR.lon);
    const courseDiff = angleDiff(brgToVor, VOR.courseOBS);
    return Math.abs(distToVor * Math.sin(courseDiff * Math.PI / 180));
  }

  // ===== Renderers =========================================================
  function setupCanvas(c){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const rect = c.getBoundingClientRect();
    c.width = Math.max(1, Math.floor(rect.width * dpr));
    c.height = Math.max(1, Math.floor(rect.height * dpr));
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return { ctx, w: rect.width, h: rect.height };
  }

  function drawAI(c){
    const { ctx, w, h } = setupCanvas(c);
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 6;
    ctx.save();
    // Round bezel mask
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();

    ctx.translate(cx, cy);
    ctx.rotate(-state.roll * Math.PI/180);
    const horizonY = state.pitch * 4; // px per deg
    // Sky
    const sky = ctx.createLinearGradient(0,-h,0,horizonY);
    sky.addColorStop(0,'#0a1830'); sky.addColorStop(1,'#3b6ea8');
    ctx.fillStyle = sky; ctx.fillRect(-w, -h, w*2, h+horizonY);
    // Ground
    const gnd = ctx.createLinearGradient(0,horizonY,0,h);
    gnd.addColorStop(0,'#5a3a1d'); gnd.addColorStop(1,'#2a1808');
    ctx.fillStyle = gnd; ctx.fillRect(-w, horizonY, w*2, h);
    // Horizon line
    ctx.strokeStyle = '#cfe7ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w, horizonY); ctx.lineTo(w, horizonY); ctx.stroke();
    // Pitch ladder
    ctx.strokeStyle = 'rgba(207,231,255,.7)'; ctx.lineWidth = 1;
    ctx.font = '10px monospace'; ctx.fillStyle = '#cfe7ff'; ctx.textAlign='center';
    for (let p=-30; p<=30; p+=5){
      if (p===0) continue;
      const y = horizonY - p*4;
      const ww = p%10===0 ? 36 : 22;
      ctx.beginPath(); ctx.moveTo(-ww,y); ctx.lineTo(ww,y); ctx.stroke();
      if (p%10===0) ctx.fillText(String(p), -ww-10, y+3);
    }
    ctx.restore();

    // Bezel + roll scale
    ctx.save();
    ctx.translate(cx,cy);
    ctx.strokeStyle = '#cfe7ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
    for (const ang of [-60,-45,-30,-20,-10,0,10,20,30,45,60]){
      const a = (ang-90)*Math.PI/180;
      const r1 = R, r2 = R - (Math.abs(ang)%30===0?10:6);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
      ctx.stroke();
    }
    // Roll pointer (rotates with roll)
    ctx.rotate(-state.roll*Math.PI/180);
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.moveTo(0,-R+2); ctx.lineTo(-6,-R+12); ctx.lineTo(6,-R+12); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Aircraft reference (fixed)
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx-R*0.55, cy); ctx.lineTo(cx-R*0.18, cy);
    ctx.moveTo(cx+R*0.18, cy); ctx.lineTo(cx+R*0.55, cy);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fillStyle='#ffeb3b'; ctx.fill();
  }

  function drawVOR(c){
    const { ctx, w, h } = setupCanvas(c);
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 10;

    // Bezel
    ctx.fillStyle = '#0a121b'; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1f2f44'; ctx.lineWidth = 2; ctx.stroke();

    // Compass card rotates so current heading is at top
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(-state.hdg*Math.PI/180);
    ctx.strokeStyle = '#cfe7ff'; ctx.fillStyle = '#cfe7ff';
    ctx.font = '11px monospace'; ctx.textAlign = 'center';
    for (let d=0; d<360; d+=10){
      const a = (d-90)*Math.PI/180;
      const major = d%30===0;
      const r1 = R-2, r2 = R - (major?12:6);
      ctx.lineWidth = major?2:1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
      ctx.stroke();
      if (major){
        const lbl = d===0?'N':d===90?'E':d===180?'S':d===270?'W':String(d/10);
        const tr = R - 22;
        ctx.fillText(lbl, Math.cos(a)*tr, Math.sin(a)*tr+4);
      }
    }
    // Course (OBS) needle: line through center, plus deflection bar
    ctx.save();
    ctx.rotate(VOR.courseOBS*Math.PI/180);
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,-R*0.85); ctx.lineTo(0,-R*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, R*0.25); ctx.lineTo(0, R*0.85); ctx.stroke();
    // Arrowhead
    ctx.beginPath(); ctx.moveTo(0,-R*0.9); ctx.lineTo(-7,-R*0.78); ctx.lineTo(7,-R*0.78); ctx.closePath();
    ctx.fillStyle='#ffeb3b'; ctx.fill();
    // CDI deflection bar — uses the smoothed display value so the needle
    // moves progressively across the dial instead of snapping side-to-side.
    const cdi = state.cdiDisplay;
    const deflectPx = cdi * R*0.5;
    ctx.strokeStyle = cdi>0?'#00ff9d':'#00ff9d';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(deflectPx, -R*0.3); ctx.lineTo(deflectPx, R*0.3); ctx.stroke();
    // Dots
    ctx.fillStyle = '#cfe7ff';
    for (const d of [-2,-1,1,2]){
      ctx.beginPath(); ctx.arc(d*R*0.12, 0, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.restore();

    // Heading index at top
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.moveTo(cx, cy-R-2); ctx.lineTo(cx-7, cy-R+8); ctx.lineTo(cx+7, cy-R+8); ctx.closePath(); ctx.fill();

    // TO/FROM and DME
    const brgFromVor = bearingTo(VOR.lat, VOR.lon, state.lat, state.lon);
    const dev = angleDiff(brgFromVor, VOR.courseOBS);
    const toFrom = Math.abs(dev) < 90 ? 'FROM' : 'TO';
    const dme = haversineNm(state.lat, state.lon, VOR.lat, VOR.lon);
    ctx.fillStyle = '#cfe7ff'; ctx.font = '11px monospace'; ctx.textAlign='left';
    ctx.fillText('OBS ' + String(VOR.courseOBS).padStart(3,'0') + '°', 8, h-30);
    ctx.fillText('CRS ' + toFrom, 8, h-16);
    ctx.textAlign='right';
    ctx.fillText('DME ' + dme.toFixed(1) + ' NM', w-8, h-16);
  }

  function drawMap(c){
    const { ctx, w, h } = setupCanvas(c);
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2;

    // The zoomable/pannable moving map. main.js owns state.map; we fall back
    // to a sensible default if the module hasn't booted yet.
    const m = state.map || { scaleNm: 5, centerLat: state.lat, centerLon: state.lon, follow: true };
    const scaleNm = m.scaleNm;
    const centerLat = m.follow ? state.lat : m.centerLat;
    const centerLon = m.follow ? state.lon : m.centerLon;
    const pxPerNm = Math.min(w,h)/2 / scaleNm;
    document.getElementById('map-scale').textContent = (scaleNm < 1 ? scaleNm.toFixed(1) : Math.round(scaleNm)) + ' NM';

    // World → screen helper (north-up).
    function project(lat, lon){
      const dN = (lat - centerLat) * 60; // NM north
      const dE = (lon - centerLon) * 60 * Math.cos(centerLat*Math.PI/180);
      return { x: cx + dE * pxPerNm, y: cy - dN * pxPerNm };
    }

    // BG grid
    ctx.fillStyle = '#070b10'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#10202f'; ctx.lineWidth = 1;
    const gridStep = scaleNm <= 5 ? 1 : scaleNm <= 25 ? 5 : scaleNm <= 100 ? 25 : 100;
    const gridPx = gridStep * pxPerNm;
    if (gridPx > 6){
      for (let x = cx % gridPx; x < w; x += gridPx){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      for (let y = cy % gridPx; y < h; y += gridPx){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    }
    // Range rings centred on map centre.
    ctx.strokeStyle = '#1f3a52'; ctx.fillStyle = '#3a5a82'; ctx.font='9px monospace'; ctx.textAlign='left';
    const ringStep = gridStep;
    for (let r = ringStep; r <= scaleNm; r += ringStep){
      ctx.beginPath(); ctx.arc(cx,cy, r*pxPerNm, 0, Math.PI*2); ctx.stroke();
      ctx.fillText(r+'NM', cx + r*pxPerNm + 2, cy - 2);
    }

    // Active mission route polyline (drawn under markers).
    const route = window.__ifrActiveRoute;
    if (Array.isArray(route) && route.length){
      ctx.strokeStyle = 'rgba(0,255,157,.55)'; ctx.lineWidth = 2;
      ctx.beginPath();
      const a = project(state.lat, state.lon); ctx.moveTo(a.x, a.y);
      for (const wp of route){ if (!wp) continue; const p = project(wp.lat, wp.lon); ctx.lineTo(p.x, p.y); }
      ctx.stroke();

      // Per-leg course (CRS) and distance labels at the midpoint of each
      // segment so the pilot can read the heading to fly between waypoints.
      const legs = [{ lat: state.lat, lon: state.lon }, ...route.filter(Boolean)];
      ctx.font = '10px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < legs.length - 1; i++){
        const A = legs[i], B = legs[i+1];
        const pa = project(A.lat, A.lon), pb = project(B.lat, B.lon);
        // Skip very short on-screen segments.
        const segPx = Math.hypot(pb.x - pa.x, pb.y - pa.y);
        if (segPx < 36) continue;
        const crs = Math.round(bearingTo(A.lat, A.lon, B.lat, B.lon));
        const dist = haversineNm(A.lat, A.lon, B.lat, B.lon);
        const label = `CRS ${String(crs).padStart(3,'0')}° · ${dist.toFixed(1)} NM`;
        const mx = (pa.x + pb.x) / 2;
        const my = (pa.y + pb.y) / 2;
        // Rotate text to align with the leg, but flip if it would render upside-down.
        let ang = Math.atan2(pb.y - pa.y, pb.x - pa.x);
        if (ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;
        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(ang);
        const padX = 5, padY = 2;
        const tw = ctx.measureText(label).width;
        // Dark pill so the label stays readable over the green route line.
        ctx.fillStyle = 'rgba(7,11,16,.85)';
        ctx.strokeStyle = 'rgba(0,255,157,.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const rectX = -tw/2 - padX, rectY = -7 - padY, rectW = tw + 2*padX, rectH = 14 + 2*padY;
        if (ctx.roundRect) { ctx.roundRect(rectX, rectY, rectW, rectH, 4); }
        else { ctx.rect(rectX, rectY, rectW, rectH); }
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#cfe7ff';
        ctx.fillText(label, 0, 1);
        ctx.restore();
      }
      ctx.textBaseline = 'alphabetic';
    }

    // Navaid markers (loaded by main.js).
    const navaids = window.__ifrNavaids || [{ id: VOR.id, freq: VOR.freq, lat: VOR.lat, lon: VOR.lon, type: 'VORDME' }];
    ctx.lineWidth = 2;
    for (const n of navaids){
      const p = project(n.lat, n.lon);
      if (p.x < -20 || p.x > w+20 || p.y < -20 || p.y > h+20) continue;
      const isIls = n.type === 'ILS';
      ctx.strokeStyle = isIls ? '#ffb547' : '#00ff9d';
      ctx.fillStyle   = isIls ? '#ffb547' : '#00ff9d';
      ctx.beginPath();
      // Hexagon for VORs, square for ILS.
      if (isIls){
        ctx.rect(p.x-6, p.y-6, 12, 12);
      } else {
        for (let i=0;i<6;i++){
          const ang = i*Math.PI/3;
          const x = p.x + Math.cos(ang)*7, y = p.y + Math.sin(ang)*7;
          if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath();
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#cfe7ff'; ctx.font = '10px monospace'; ctx.textAlign='left';
      ctx.fillText(n.id, p.x + 9, p.y + 4);
      // Frequency under the id (and runway heading for ILS).
      if (n.freq != null){
        ctx.fillStyle = isIls ? '#ffb547' : '#7cd8ff';
        ctx.font = '9px monospace';
        const f = (typeof n.freq === 'number' ? n.freq : parseFloat(n.freq)).toFixed(2);
        ctx.fillText(f, p.x + 9, p.y + 15);
        if (isIls && typeof n.runway_heading === 'number'){
          ctx.fillStyle = '#5b7a99';
          ctx.fillText('RWY ' + String(n.runway_heading).padStart(3,'0'), p.x + 9, p.y + 25);
        }
      }
    }

    // Aircraft icon (rotated by heading), drawn at its world position.
    const ap = project(state.lat, state.lon);
    ctx.save();
    ctx.translate(ap.x, ap.y);
    ctx.rotate(state.hdg*Math.PI/180);
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(0,-10); ctx.lineTo(-7,8); ctx.lineTo(0,4); ctx.lineTo(7,8);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // North indicator (north is always up in this map).
    ctx.save();
    ctx.translate(w-22, 22);
    ctx.strokeStyle = '#cfe7ff'; ctx.fillStyle = '#cfe7ff';
    ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(-5,8); ctx.lineTo(5,8); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#cfe7ff'; ctx.font='10px monospace'; ctx.textAlign='center';
    ctx.fillText('N', w-22, 42);
  }

  // ===== HUD text ==========================================================
  const hudEls = {
    hdg: document.getElementById('hdg'), alt: document.getElementById('alt'),
    ias: document.getElementById('ias'), vs:  document.getElementById('vs'),
    pos: document.getElementById('pos'), rate:document.getElementById('rate'),
    clk: document.getElementById('clk')
  };
  function fmt(n,w){ return String(Math.round(n)).padStart(w,'0'); }
  function fmtClk(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60; return fmt(h,2)+':'+fmt(m,2)+':'+fmt(ss,2); }
  function updateHud(){
    hudEls.hdg.textContent = fmt(state.hdg,3);
    hudEls.alt.textContent = fmt(state.alt,1);
    hudEls.ias.textContent = fmt(state.ias,1);
    hudEls.vs.textContent  = (state.vs>=0?'+':'') + fmt(state.vs,1);
    hudEls.pos.textContent = state.lat.toFixed(4)+', '+state.lon.toFixed(4);
    hudEls.rate.textContent = state.simRate + 'x';
    hudEls.clk.textContent = fmtClk(state.simTime);
  }

  // ===== Main loop =========================================================
  const cAi = document.getElementById('cv-ai');
  const cVor = document.getElementById('cv-vor');
  const cMap = document.getElementById('cv-map');

  function frame(now){
    const wallDt = Math.min(0.1, (state.lastWall ? (now - state.lastWall)/1000 : 1/60));
    state.lastWall = now;
    if (!state.paused){
      const simDt = wallDt * state.simRate;
      const steps = Math.max(1, Math.ceil(simDt / MAX_STEP));
      const sub = simDt / steps;
      for (let i=0;i<steps;i++) step(sub);
    }
    drawAI(cAi); drawVOR(cVor); drawMap(cMap);
    updateHud();
    requestAnimationFrame(frame);
  }

  // ===== Boot ==============================================================
  renderVel();
  window.addEventListener('resize', () => { /* canvas resizes via setupCanvas each frame */ });

  // Test hooks
  window.__ifrPilot = { state, RATES, setRate, cycleRate, step, VOR, vorCdi, bearingTo };

  // ===== Map navaid popup =================================================
  // Click a VOR/ILS marker on the moving map to see its frequency, type,
  // and (for ILS) runway heading. Clicking empty map space closes the popup.
  (function navaidPopup(){
    const popup = document.getElementById('map-popup');
    const mapSec = document.getElementById('map');
    let downAt = null;
    cMap.addEventListener('mousedown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
    cMap.addEventListener('click', (e) => {
      // Suppress click that was actually a pan-drag (>4px of motion).
      if (downAt){
        const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
        downAt = null;
        if (moved > 4) return;
      }
      const rect = cMap.getBoundingClientRect();
      const px = e.clientX - rect.left, py = e.clientY - rect.top;
      const w = rect.width, h = rect.height;
      const m = state.map || { scaleNm: 5, centerLat: state.lat, centerLon: state.lon, follow: true };
      const cx = w/2, cy = h/2;
      const centerLat = m.follow ? state.lat : m.centerLat;
      const centerLon = m.follow ? state.lon : m.centerLon;
      const pxPerNm = Math.min(w,h)/2 / m.scaleNm;
      const navaids = window.__ifrNavaids || [];
      let best = null, bestD = Infinity;
      for (const n of navaids){
        const dN = (n.lat - centerLat) * 60;
        const dE = (n.lon - centerLon) * 60 * Math.cos(centerLat*Math.PI/180);
        const x = cx + dE * pxPerNm, y = cy - dN * pxPerNm;
        const d = Math.hypot(x - px, y - py);
        if (d < bestD){ bestD = d; best = { n, x, y }; }
      }
      if (!best || bestD > 14){ popup.style.display = 'none'; return; }
      showPopup(best.n, best.x, best.y);
    });
    popup.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.classList.contains('pop-close')){ popup.style.display = 'none'; return; }
      if (t && t.classList.contains('pop-tune')){
        const freq = parseFloat(t.getAttribute('data-freq'));
        if (!Number.isNaN(freq)){
          state.radio.nav1.standby = Math.round(freq*100)/100;
          if (window.__ifrRadioRender) window.__ifrRadioRender();
          showToast('NAV1 STBY ' + freq.toFixed(2));
        }
      }
    });
    function showPopup(n, x, y){
      const isIls = n.type === 'ILS';
      const freq = (typeof n.freq === 'number' ? n.freq : parseFloat(n.freq)).toFixed(2);
      const rows = [
        `<div class="pop-id ${isIls?'ils':''}"><span>${n.id}</span><span>${n.type||''}</span></div>`,
        n.name ? `<div class="pop-name">${n.name}</div>` : '',
        `<div class="pop-row"><span>FREQ</span><b>${freq}</b></div>`,
        isIls && typeof n.runway_heading === 'number' ? `<div class="pop-row"><span>RWY HDG</span><b>${String(n.runway_heading).padStart(3,'0')}°</b></div>` : '',
        isIls && typeof n.glideslope_deg === 'number' ? `<div class="pop-row"><span>GS</span><b>${n.glideslope_deg.toFixed(1)}°</b></div>` : '',
        `<div class="pop-row"><span>LAT/LON</span><b>${n.lat.toFixed(3)}, ${n.lon.toFixed(3)}</b></div>`,
        `<button class="pop-tune" data-freq="${freq}" type="button">TUNE NAV1 STBY → ${freq}</button>`,
        `<span class="pop-close" title="Close">×</span>`
      ].join('');
      popup.innerHTML = rows;
      // Position relative to the #map section (popup is a child of it).
      const secRect = mapSec.getBoundingClientRect();
      const canRect = cMap.getBoundingClientRect();
      let left = (canRect.left - secRect.left) + x + 14;
      let top  = (canRect.top  - secRect.top)  + y - 8;
      // Keep on-screen within the section.
      const pw = 200, ph = 140;
      if (left + pw > secRect.width) left = (canRect.left - secRect.left) + x - pw - 14;
      if (top + ph > secRect.height) top = secRect.height - ph - 4;
      if (top < 4) top = 4;
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
      popup.style.display = 'block';
    }
  })();

  // ===== Knob arming + mouse-wheel scroll =================================
  // Click an LED to "arm" a knob, then scroll the mouse wheel anywhere to
  // change it. Click again (or click another knob/elsewhere) to disarm.
  (function knobWheel(){
    let armed = null; // { id, kind, step, fn, container }
    function disarm(){
      if (armed && armed.container) armed.container.classList.remove('armed');
      armed = null;
    }
    const apKnobMap = {
      'ap-hdg-val': { fn: bumpHdg,  step: 1,   big: 5,   label: 'HDG' },
      'ap-crs-val': { fn: bumpCrs,  step: 1,   big: 5,   label: 'CRS' },
      'ap-alt-val': { fn: bumpAlt,  step: 100, big: 1000,label: 'ALT' },
      'ap-vs-val':  { fn: bumpVs,   step: 100, big: 500, label: 'VS'  }
    };
    Object.keys(apKnobMap).forEach((id) => {
      const led = document.getElementById(id);
      if (!led) return;
      const container = led.closest('.ap-knob');
      led.addEventListener('click', (e) => {
        e.stopPropagation();
        if (armed && armed.id === id){ disarm(); return; }
        disarm();
        armed = { id, kind:'ap', container, ...apKnobMap[id] };
        container.classList.add('armed');
        showToast('SCROLL = ' + apKnobMap[id].label);
      });
    });
    // Radio standby LEDs are armable too.
    function wireRadioRowsArming(){
      const radioEl = document.getElementById('radio-panel');
      const meta = {
        nav1: { step: 0.05, big: 1.00, min: 108.00, max: 117.95, dec: 2 },
        nav2: { step: 0.05, big: 1.00, min: 108.00, max: 117.95, dec: 2 },
        com1: { step: 0.025,big: 1.00, min: 118.000,max: 136.975,dec: 3 },
        com2: { step: 0.025,big: 1.00, min: 118.000,max: 136.975,dec: 3 }
      };
      radioEl.querySelectorAll('[id^="rad-"][id$="-sby"]').forEach((led) => {
        const k = led.id.replace('rad-','').replace('-sby',''); // e.g. nav1
        if (!meta[k]) return;
        const container = led.closest('.rad-row');
        led.addEventListener('click', (e) => {
          e.stopPropagation();
          if (armed && armed.id === led.id){ disarm(); return; }
          disarm();
          armed = {
            id: led.id, kind:'radio', container,
            step: meta[k].step, big: meta[k].big,
            label: k.toUpperCase() + ' STBY',
            fn: (delta) => {
              const m = meta[k]; const s = state.radio[k];
              s.standby = Math.max(m.min, Math.min(m.max, s.standby + delta));
              s.standby = Math.round(s.standby / m.step) * m.step;
              if (window.__ifrRadioRender) window.__ifrRadioRender();
              // Re-attach armed indicator after re-render.
              const el = document.getElementById(led.id);
              if (el){
                const c = el.closest('.rad-row');
                if (c){ c.classList.add('armed'); armed.container = c; }
              }
            }
          };
          container.classList.add('armed');
          showToast('SCROLL = ' + armed.label);
        });
      });
    }
    wireRadioRowsArming();
    // The radio panel re-renders on every change; re-bind after each render.
    const origRender = window.__ifrRadioRender;
    window.__ifrRadioRender = function(){
      if (origRender) origRender();
      wireRadioRowsArming();
    };
    // Disarm when clicking outside knobs/leds.
    document.addEventListener('click', (e) => {
      if (!armed) return;
      const t = e.target;
      if (t.closest && (t.closest('.ap-knob.armed') || t.closest('.rad-row.armed'))) return;
      disarm();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') disarm(); });
    // Wheel handler — only acts when a knob is armed.
    window.addEventListener('wheel', (e) => {
      if (!armed) return;
      // Don't interfere with map zoom — map has its own wheel handler that
      // calls preventDefault() before this fires.
      if (e.target === cMap) return;
      e.preventDefault();
      const sign = e.deltaY < 0 ? +1 : -1;
      const big = e.shiftKey;
      const delta = sign * (big ? armed.big : armed.step);
      armed.fn(delta);
    }, { passive: false });
  })();

  requestAnimationFrame((t) => { state.lastWall = t; requestAnimationFrame(frame); });
})();
</script>
